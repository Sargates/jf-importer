[package]
name = "jf-import-library"
version = "0.1.0"
edition = "2024"

[lib]
name = "jfi"
path = "src/lib.rs"

[dependencies]
etcetera = "0.11.0"
ignore = "0.4.25"
json = "0.12.4"
once_cell = "1.21.4"
regex = "1.12.2"
reqwest = { version = "0.12.26", features = ["json", "blocking"] }
urlencoding = "2.1.3"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
futures = "0.3.32"
governor = "0.10.4"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
itertools = "0.15.0"

