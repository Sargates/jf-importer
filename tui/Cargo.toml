[package]
name = "jellyfin-importer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jellyfin_importer"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
directories = "6.0.0"
etcetera = "0.11.0"
futures = "0.3.32"
jf-import-library = { path = "../lib" }
lazy_static = "1.5.0"
once_cell = "1.21.4"
ratatui = "0.30.0"
reqwest = { version = "0.12.26", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"



